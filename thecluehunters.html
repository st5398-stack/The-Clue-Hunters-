<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE CLUE HUNTERS — Every Clue Matters</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka (Comic/Bold Display) & Nunito (Clean Readable Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --comic-black: #18181b;
      --comic-yellow: #ffd60a;
      --comic-blue: #38bdf8;
      --comic-purple: #a855f7;
      --comic-green: #4ade80;
      --comic-red: #ef4444;
      --paper-bg: #fffdf7;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fef9c3;
      background-image: radial-gradient(#eab308 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      color: var(--comic-black);
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .comic-font {
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.02em;
    }

    /* Thick Comic Book Borders & Tactile Shadows */
    .comic-box {
      border: 3.5px solid var(--comic-black);
      box-shadow: 5px 5px 0px var(--comic-black);
      border-radius: 1.25rem;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .comic-box-sm {
      border: 3px solid var(--comic-black);
      box-shadow: 3px 3px 0px var(--comic-black);
      border-radius: 0.9rem;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .comic-btn {
      border: 3px solid var(--comic-black);
      box-shadow: 4px 4px 0px var(--comic-black);
      border-radius: 0.95rem;
      font-family: 'Fredoka', sans-serif;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      cursor: pointer;
    }

    .comic-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--comic-black);
    }

    .comic-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--comic-black);
    }

    .comic-btn:focus-visible,
    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 4px solid #2563eb;
      outline-offset: 3px;
    }

    /* Halftone Pattern Overlay */
    .halftone-bg {
      background-image: radial-gradient(rgba(24, 24, 27, 0.13) 1.5px, transparent 1.5px);
      background-size: 10px 10px;
    }

    /* Detective Folder Tab */
    .folder-tab {
      position: relative;
      border: 3.5px solid var(--comic-black);
      border-bottom: none;
      border-radius: 1rem 1rem 0 0;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1.25rem;
      font-family: 'Fredoka', sans-serif;
      box-shadow: 4px 0px 0px var(--comic-black);
    }

    /* Comic Text Stroke Effect */
    .comic-title-stroke {
      -webkit-text-stroke: 2px var(--comic-black);
      text-shadow: 4px 4px 0px var(--comic-black);
    }

    /* Tape Decoration */
    .comic-tape {
      background-color: rgba(254, 240, 138, 0.85);
      border: 2px solid rgba(24, 24, 27, 0.25);
      transform: rotate(-2deg);
    }

    /* Celebratory Confetti / Pulse Animation (Respects Reduced Motion) */
    @keyframes popBounce {
      0% { transform: scale(0.92); opacity: 0; }
      70% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: popBounce 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .comic-btn:hover:not(:disabled),
      .comic-btn:active:not(:disabled) {
        transform: none !important;
      }
    }

    /* Print Styling for Teacher Guide / Worksheet Instructions */
    @media print {
      body {
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-sheet {
        display: block !important;
        border: 2px solid #000 !important;
        box-shadow: none !important;
      }
      #teacher-worksheet-document {
        position: fixed;
        inset: 0;
        width: 100%;
        height: auto;
        background: white !important;
        border: 3px solid #000 !important;
        padding: 16px !important;
        z-index: 9999;
      }
    }
  </style>
</head>

       4. APPLICATION STATE & LOCALSTORAGE PREFERENCES
    ============================================================================ */
    const state = {
      currentView: "home", // 'home' | 'glossary' | 'talk' | 'challenge' | 'teacher'
      soundEnabled: true,

      // Glossary state
      glossarySearch: "",
      glossaryCaseFilter: "all", // 'all' | '0' | '1'..'20'

    // Load sound preference safely
    try {
      const savedSound = localStorage.getItem("clueHunters_soundEnabled");

    } catch (e) {

    /* ============================================================================
       5. WEB AUDIO API SOUND EFFECTS & TEXT-TO-SPEECH PRONUNCIATION
    ============================================================================ */
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    // Positive reward chime for correct answer
    function playCorrectSound() {
      if (!state.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99]; // C5 -> E5 -> G5 pleasant major triad
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.001, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.3);
        });
      } catch (err) {
        // Audio is supplementary; fail silently
      }
    }

    // Gentle, neutral error tone for incorrect answer
    function playIncorrectSound() {
      if (!state.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [330, 277.18]; // Soft descending interval
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.3);
        });
      } catch (err) {
        // Audio is supplementary; fail silently
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      try {
        localStorage.setItem("clueHunters_soundEnabled", String(state.soundEnabled));
      } catch (e) {}
      updateSoundUI();
      if (state.soundEnabled) {
        playCorrectSound();
      }
    }

    function updateSoundUI() {
      const btn = document.getElementById("global-sound-toggle");
      const icon = document.getElementById("sound-icon");
      const label = document.getElementById("sound-label");
      if (!btn || !icon || !label) return;
      btn.setAttribute("aria-pressed", String(state.soundEnabled));
      if (state.soundEnabled) {
        icon.textContent = "🔊";
        label.textContent = "Sound: ON";
        btn.classList.remove("bg-zinc-200", "text-zinc-600");
        btn.classList.add("bg-white", "text-zinc-900");
      } else {
        icon.textContent = "🔇";
        label.textContent = "Sound: OFF";
        btn.classList.remove("bg-white", "text-zinc-900");
        btn.classList.add("bg-zinc-200", "text-zinc-600");
      }
    }

    // Text-to-Speech Pronunciation Support
    const isSpeechSupported = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

    function speakText(text, btnEl) {
      if (!isSpeechSupported) {
        showToast("Pronunciation audio is not supported in this browser.");
        return;
      }
      try {
        window.speechSynthesis.cancel();
        // Clean ellipsis for smoother speech
        const cleanText = text.replace(/\.\.\./g, "");
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "en-US";
        utterance.rate = 0.92; // Slightly slower for A1+-A2 English learners

        if (btnEl) {
          btnEl.classList.add("ring-4", "ring-amber-400");
          utterance.onend = () => btnEl.classList.remove("ring-4", "ring-amber-400");
          utterance.onerror = () => btnEl.classList.remove("ring-4", "ring-amber-400");
        }
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        showToast("Unable to play pronunciation right now.");
      }
    }

    /* ============================================================================
       6. NAVIGATION & EXIT CONFIRMATION PROTECTION
    ============================================================================ */
    function isQuizInProgress() {
      return state.currentView === "challenge" && state.quizMode === "playing";
    }

    function requestNavigation(targetView, customCallback = null) {
      // If navigating away or resetting during an unfinished quiz, ask for confirmation
      if (isQuizInProgress()) {
        state.pendingNavAction = () => {
          resetQuizState();
          if (customCallback) {
            customCallback();
          } else {
            navigateTo(targetView);
          }
        };
        openExitModal();
        return;
      }

      if (customCallback) {
        customCallback();
      } else {
        navigateTo(targetView);
      }
    }

    function navigateTo(view) {
      state.currentView = view;
      if (view !== "challenge") {
        resetQuizState();
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openExitModal() {
      const modal = document.getElementById("exit-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      setTimeout(() => {
        document.getElementById("modal-continue-btn").focus();
      }, 30);
    }

    function closeExitModal() {
      const modal = document.getElementById("exit-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      state.pendingNavAction = null;
    }

    function confirmExitAction() {
      const action = state.pendingNavAction;
      closeExitModal();
      if (typeof action === "function") {
        action();
      }
    }

    // Escape key closes exit modal safely
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const modal = document.getElementById("exit-modal");
        if (modal && !modal.classList.contains("hidden")) {
          closeExitModal();
        }
      }
    });

    // Browser refresh / tab close protection ONLY during an unfinished quiz
    window.addEventListener("beforeunload", (e) => {
      if (isQuizInProgress()) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    /* ============================================================================
       7. CLIPBOARD & TOAST UTILITIES
    ============================================================================ */
    let toastTimer = null;
    function showToast(msg) {
      const banner = document.getElementById("toast-banner");
      const textEl = document.getElementById("toast-message");
      textEl.textContent = msg;
      banner.classList.remove("hidden");
      banner.classList.add("flex");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add("hidden");
        banner.classList.remove("flex");
      }, 2400);
    }

    function copyExpression(text, btnElement) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        // Fallback handled visually
      }
      document.body.removeChild(textarea);

      // Immediate visual confirmation on the button itself + status toast
      const originalHTML = btnElement.innerHTML;
      btnElement.innerHTML = `<span aria-hidden="true">✅</span> <span>Copied!</span>`;
      btnElement.classList.remove("bg-white");
      btnElement.classList.add("bg-green-300");
      showToast(`Copied: "${text}"`);

      setTimeout(() => {
        btnElement.innerHTML = originalHTML;
        btnElement.classList.remove("bg-green-300");
        btnElement.classList.add("bg-white");
      }, 1600);
    }

    function getFilteredGlossary() {
      const query = state.glossarySearch.trim().toLowerCase();
      let list = GLOSSARY_DATA.filter((item) => {
        const matchesCase =
          state.glossaryCaseFilter === "all" ||
          String(item.caseNum) === state.glossaryCaseFilter;

        if (!matchesCase) return false;
        if (!query) return true;

        return (
          item.word.toLowerCase().includes(query) ||
          item.definition.toLowerCase().includes(query) ||
          item.spanish.toLowerCase().includes(query) ||
          item.example.toLowerCase().includes(query)
        );
      });

      if (state.glossarySort === "az") {
        list = [...list].sort((a, b) => a.word.localeCompare(b.word));
      } else {
        list = [...list].sort((a, b) => a.caseNum - b.caseNum || a.word.localeCompare(b.word));
      }

      return list;
    }

    function renderGlossaryCards(items) {
      if (items.length === 0) {
        return `
          <div class="comic-box bg-white p-8 text-center max-w-xl mx-auto">
            <div class="text-5xl mb-3" aria-hidden="true">🔎</div>
            <h2 class="text-2xl font-bold text-zinc-900 mb-2">
              No clues found for "${escapeHtml(state.glossarySearch)}"
            </h2>
            <p class="text-zinc-700 font-bold mb-5">
              Try checking your spelling, searching in English or Spanish, or selecting "All Cases" in the filter above.
            </p>
            <button
              type="button"
              onclick="resetGlossaryFilters()"
              class="comic-btn px-5 py-2.5 bg-amber-300 hover:bg-amber-200 font-bold text-sm"
            >
              Show All Words
            </button>
          </div>
        `;
      }

      // Helper to render an individual vocabulary card
      const renderSingleCard = (item) => `
        <article class="comic-box bg-white p-5 flex flex-col justify-between">
          <div>
            <!-- Top Row: Case Badge + Audio Button -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-extrabold border-2 border-zinc-900 ${item.caseNum === 0 ? "bg-amber-300" : "bg-sky-200"}">
                ${item.caseLabel}
              </span>
              ${isSpeechSupported ? `
                <button
                  type="button"
                  onclick="speakText('${escapeAttr(item.word)}', this)"
                  class="comic-btn px-3 py-1.5 bg-amber-300 hover:bg-amber-200 text-xs font-extrabold flex items-center gap-1.5"
                  aria-label="Listen to pronunciation of ${escapeAttr(item.word)}"
                >
                  <span aria-hidden="true">🔊</span>
                  <span>Listen</span>
                </button>
              ` : ""}
            </div>

            <!-- English Word -->
            <h3 class="text-2xl font-bold text-zinc-900 mb-1">
              ${escapeHtml(item.word)}
            </h3>

            <!-- Spanish Translation -->
            <p class="text-sm font-extrabold text-purple-700 mb-3 flex items-center gap-1.5">
              <span class="bg-purple-100 border border-purple-400 px-2 py-0.5 rounded-md text-xs">ES</span>
              <span>${escapeHtml(item.spanish)}</span>
            </p>

            <!-- Simple A1+-A2 Definition -->
            <p class="text-zinc-800 font-bold text-sm leading-relaxed mb-4">
              ${escapeHtml(item.definition)}
            </p>
          </div>

          <!-- Contextualized Example Sentence -->
          <div class="bg-amber-50 border-2 border-zinc-900/20 rounded-xl p-3">
            <span class="block text-[11px] font-extrabold uppercase tracking-wider text-zinc-500 mb-0.5">
              Example in Context
            </span>
            <p class="text-xs sm:text-sm font-bold italic text-zinc-900">
              "${escapeHtml(item.example)}"
            </p>
          </div>
        </article>
      `;

      // Flat A-Z View
      if (state.glossarySort === "az") {
        return `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${items.map((item) => renderSingleCard(item)).join("")}
          </div>
        `;
      }

      // Grouped by Case View (General Vocabulary + Case 1 to Case 20 collapsible case boxes)
      const sectionOrder = [0, ...Array.from({ length: 20 }, (_, i) => i + 1)];
      const sectionColors = [
        "bg-amber-300",
        "bg-sky-300",
        "bg-purple-300",
        "bg-green-300",
        "bg-rose-300"
      ];
      const isSearching = state.glossarySearch.trim().length > 0;
      const isSingleCaseFiltered = state.glossaryCaseFilter !== "all";

      return `
        <div class="space-y-4">
          ${sectionOrder.map((caseNum) => {
            const groupItems = items
              .filter((item) => item.caseNum === caseNum)
              .sort((a, b) => a.word.localeCompare(b.word));

            if (groupItems.length === 0) return "";

            const sectionTitle =
              caseNum === 0
                ? "General Vocabulary"
                : caseNum === 20
                ? "Case 20 — The Last Day of School"
                : `Case ${caseNum}`;

            const cardBg = caseNum === 0 ? "bg-amber-300" : sectionColors[caseNum % sectionColors.length];
            const isExpanded = isSearching || isSingleCaseFiltered || Boolean(state.openGlossaryCases[caseNum]);

            return `
              <section aria-labelledby="glossary-section-${caseNum}" class="comic-box bg-white overflow-hidden">
                <!-- Clickable Case Box Header -->
                <button
                  type="button"
                  onclick="toggleGlossaryCase(${caseNum})"
                  aria-expanded="${isExpanded}"
                  aria-controls="glossary-panel-${caseNum}"
                  class="w-full ${cardBg} hover:brightness-95 transition-all px-5 py-4 flex items-center justify-between gap-3 text-left cursor-pointer ${isExpanded ? "border-b-3 border-zinc-900" : ""}"
                >
                  <div class="flex items-center gap-3 flex-wrap">
                    <span class="w-10 h-10 rounded-xl bg-white border-3 border-zinc-900 shadow-[2px_2px_0px_#18181b] flex items-center justify-center text-xl shrink-0" aria-hidden="true">
                      ${caseNum === 0 ? "🕵️" : isExpanded ? "📂" : "📁"}
                    </span>
                    <div>
                      <h2 id="glossary-section-${caseNum}" class="comic-font text-xl sm:text-2xl font-bold text-zinc-900 leading-tight">
                        ${sectionTitle}
                      </h2>
                      <span class="text-xs font-extrabold text-zinc-800">
                        ${isExpanded ? "Click to hide words" : "Click to open case words"}
                      </span>
                    </div>
                  </div>

                  <div class="flex items-center gap-2.5 shrink-0">
                    <span class="bg-white text-zinc-900 text-xs sm:text-sm font-extrabold px-3 py-1 rounded-full border-2 border-zinc-900 shadow-[2px_2px_0px_#18181b]">
                      ${groupItems.length} ${groupItems.length === 1 ? "word" : "words"}
                    </span>
                    <span class="w-9 h-9 rounded-xl bg-zinc-900 text-amber-300 font-extrabold flex items-center justify-center text-sm transition-transform duration-200 ${isExpanded ? "rotate-180" : ""}" aria-hidden="true">
                      ▼
                    </span>
                  </div>
                </button>

                <!-- Collapsible Vocabulary Cards Container -->
                ${isExpanded ? `
                  <div id="glossary-panel-${caseNum}" class="p-4 sm:p-6 bg-amber-50/40 halftone-bg animate-pop">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                      ${groupItems.map((item) => renderSingleCard(item)).join("")}
                    </div>
                  </div>
                ` : ""}
              </section>
            `;
          }).join("")}
        </div>
      `;
    }

    function toggleGlossaryCase(caseNum) {
      state.openGlossaryCases[caseNum] = !state.openGlossaryCases[caseNum];
      renderApp();
    }

    function attachGlossaryListeners() {
      const searchInput = document.getElementById("glossary-search-input");
      const caseSelect = document.getElementById("glossary-case-select");
      const sortSelect = document.getElementById("glossary-sort-select");

      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          state.glossarySearch = e.target.value;
          // Update results immediately without losing input focus
          const container = document.getElementById("glossary-results-container");
          if (container) {
            container.innerHTML = renderGlossaryCards(getFilteredGlossary());
          }
          // Re-render full view only if clear button visibility needs toggling
          const hasClear = Boolean(searchInput.parentElement.querySelector("button"));
          if ((state.glossarySearch && !hasClear) || (!state.glossarySearch && hasClear)) {
            const pos = searchInput.selectionStart;
            renderApp();
            const newInput = document.getElementById("glossary-search-input");
            if (newInput) {
              newInput.focus();
              newInput.setSelectionRange(pos, pos);
            }
          }
        });
      }

      if (caseSelect) {
        caseSelect.addEventListener("change", (e) => {
          state.glossaryCaseFilter = e.target.value;
          renderApp();
        });
      }

      if (sortSelect) {
        sortSelect.addEventListener("change", (e) => {
          state.glossarySort = e.target.value;
          renderApp();
        });
      }
    }

    function clearGlossarySearch() {
      state.glossarySearch = "";
      renderApp();
      const input = document.getElementById("glossary-search-input");
      if (input) input.focus();
    }

    function resetGlossaryFilters() {
      state.glossarySearch = "";
      state.glossaryCaseFilter = "all";
      renderApp();
    }

       VIEW 3: DETECTIVE TALK

      return `
        <section class="animate-pop">
          <!-- Top Navigation Row -->

            <div class="folder-tab bg-purple-300 text-zinc-900 font-bold text-sm sm:text-base ml-2">
              <span aria-hidden="true">💬</span>
              <span>COMMUNICATION LAB — DETECTIVE TALK</span>
            </div>
            <button
              type="button"

              class="comic-btn px-4 py-2 bg-white hover:bg-amber-100 text-sm font-bold flex items-center gap-2"

          <div class="comic-box bg-purple-200 halftone-bg p-5 sm:p-7 mb-6">

                  <button

                    class="comic-btn px-4 py-2 text-sm font-bold ${

          <!-- Expression Categories -->
          <div class="space-y-6">

                  ${group.expressions.map((exp) => `
                    <div class="${group.color} border-3 border-zinc-900 rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-[3px_3px_0px_#18181b]">
                      <div>
                        <p class="comic-font text-xl font-bold text-zinc-900 mb-1">

                        </p>

                          <span class="uppercase text-[11px] font-extrabold text-zinc-500 mr-1">Example:</span>
                          ${escapeHtml(exp.usage)}
                        </p>
                      </div>

                      <div class="flex items-center gap-2 pt-1">
                        ${isSpeechSupported ? `
                          <button
                            type="button"
                            onclick="speakText('${escapeAttr(exp.text)}', this)"
                            class="comic-btn px-3.5 py-2 bg-amber-300 hover:bg-amber-200 text-xs sm:text-sm font-extrabold flex items-center gap-1.5"
                            aria-label="Listen to ${escapeAttr(exp.text)}"
                          >
                            <span aria-hidden="true">🔊</span>
                            <span>Listen</span>
                          </button>
                        ` : ""}
                        <button

    function setTalkCategory(category) {

      renderApp();
    }

    /* ----------------------------------------------------------------------------
       VIEW 4: VOCABULARY CHALLENGE (20 CASE QUIZZES, 5 QUESTIONS EACH = 100)
    ---------------------------------------------------------------------------- */
    function resetQuizState() {
      state.quizMode = "select";
      state.activeCase = null;
      state.currentQuestionIdx = 0;
      state.score = 0;
      state.selectedOptionIdx = null;
      state.isAnswered = false;
      state.userAnswers = [];
    }

    function startCaseQuiz(caseNum) {
      state.quizMode = "playing";
      state.activeCase = caseNum;
      state.currentQuestionIdx = 0;
      state.score = 0;
      state.selectedOptionIdx = null;
      state.isAnswered = false;
      state.userAnswers = [];
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restartCurrentQuiz() {
      if (state.activeCase !== null) {
        startCaseQuiz(state.activeCase);
      }
    }

    function renderChallengeView() {
      if (state.quizMode === "playing" && state.activeCase !== null) {
        return renderActiveQuizQuestion();
      }
      if (state.quizMode === "results" && state.activeCase !== null) {
        return renderQuizResults();
      }
      return renderCaseSelectionGrid();
    }

    function renderCaseSelectionGrid() {
      const cardColors = [
        "bg-amber-200",
        "bg-sky-200",
        "bg-purple-200",
        "bg-green-200",
        "bg-rose-200"
      ];

      return `
        <section class="animate-pop">
          <!-- Top Navigation Row -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="folder-tab bg-green-300 text-zinc-900 font-bold text-sm sm:text-base ml-2">
              <span aria-hidden="true">🎯</span>
              <span>CASE MISSIONS — VOCABULARY CHALLENGE</span>
            </div>
            <button
              type="button"
              onclick="navigateTo('home')"
              class="comic-btn px-4 py-2 bg-white hover:bg-amber-100 text-sm font-bold flex items-center gap-2"
            >
              <span aria-hidden="true">🏠</span>
              <span>Return Home</span>
            </button>
          </div>

          <!-- Instruction Banner -->
          <div class="comic-box bg-green-200 halftone-bg p-5 sm:p-7 mb-6">
            <div class="inline-block bg-amber-300 border-3 border-zinc-900 rounded-xl px-4 py-1.5 font-extrabold text-sm sm:text-base mb-3 shadow-[3px_3px_0px_#18181b]">
              🕵️‍♀️ Have you solved this mystery? Let's test your vocabulary!
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold text-zinc-900 mb-2">
              Select a Mystery Case
            </h1>
            <p class="text-zinc-900 font-bold text-base">
              Choose any of the 20 cases below after investigating its physical cards. Each challenge has 5 questions (100 questions in total).
            </p>
          </div>

          <!-- 20 Selectable Case Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            ${Array.from({ length: 20 }, (_, i) => {
              const caseNum = i + 1;
              const color = cardColors[i % cardColors.length];
              const isCase20 = caseNum === 20;
              return `
                <article class="comic-box ${color} p-5 flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                      <span class="bg-red-500 text-white border-2 border-zinc-900 px-3 py-1 rounded-lg comic-font text-base font-bold shadow-[2px_2px_0px_#18181b]">
                        CASE #${caseNum}
                      </span>
                      <span class="text-xs font-extrabold bg-white/90 px-2.5 py-1 rounded-full border-2 border-zinc-900">
                        5 Questions
                      </span>
                    </div>
                    <h2 class="text-xl font-bold text-zinc-900 mb-4 leading-snug">
                      ${isCase20 ? "Case #20: The Last Day of School" : `Mystery Case #${caseNum}`}
                    </h2>
                  </div>

                  <button
                    type="button"

          </div>
        </section>
      `;
    }

    function renderActiveQuizQuestion() {
      const questions = QUIZZES_DATA[state.activeCase];
      const q = questions[state.currentQuestionIdx];
      const progressPercent = ((state.currentQuestionIdx + (state.isAnswered ? 1 : 0)) / questions.length) * 100;
      const letters = ["A", "B", "C", "D"];

      return `
        <section class="animate-pop max-w-3xl mx-auto">
          <!-- Top Bar: Case Info, Score, Sound & Home -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="flex items-center gap-2">
              <span class="bg-red-500 text-white border-3 border-zinc-900 px-3.5 py-1.5 rounded-xl comic-font text-base font-bold shadow-[3px_3px_0px_#18181b]">
                ${CASE_TITLES[state.activeCase]}
              </span>
              <span class="bg-amber-300 border-3 border-zinc-900 px-3.5 py-1.5 rounded-xl font-extrabold text-sm shadow-[3px_3px_0px_#18181b]">
                Score: ${state.score} / ${questions.length}
              </span>
            </div>

            <div class="flex items-center gap-2">
              <button
                type="button"
                onclick="requestNavigation('challenge')"
                class="comic-btn px-3.5 py-2 bg-white hover:bg-zinc-100 text-xs sm:text-sm font-bold"
              >
                All Cases
              </button>
              <button
                type="button"
                onclick="requestNavigation('home')"
                class="comic-btn px-3.5 py-2 bg-white hover:bg-amber-100 text-xs sm:text-sm font-bold flex items-center gap-1"
              >
                <span aria-hidden="true">🏠</span>
                <span>Home</span>
              </button>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="mb-5 bg-white border-3 border-zinc-900 rounded-2xl p-3 shadow-[3px_3px_0px_#18181b]">
            <div class="flex items-center justify-between text-xs sm:text-sm font-extrabold text-zinc-800 mb-1.5">
              <span>Question ${state.currentQuestionIdx + 1} of ${questions.length}</span>
              <span class="bg-purple-200 px-2.5 py-0.5 rounded-full border border-zinc-900 text-xs">
                ${q.type}
              </span>
            </div>
            <div class="w-full h-4 bg-zinc-200 rounded-full border-2 border-zinc-900 overflow-hidden" role="progressbar" aria-valuenow="${state.currentQuestionIdx + 1}" aria-valuemin="1" aria-valuemax="${questions.length}">
              <div class="h-full bg-green-400 transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <!-- Question Card -->
          <div class="comic-box bg-white p-6 sm:p-8">
            <h2 class="text-xl sm:text-2xl font-bold text-zinc-900 mb-6 leading-snug">
              ${escapeHtml(q.prompt)}
            </h2>

            <!-- 4 Answer Options -->
            <div class="space-y-3" role="radiogroup" aria-label="Answer options">
              ${q.options.map((opt, idx) => {
                let btnClasses = "bg-amber-50 hover:bg-amber-100 text-zinc-900";
                let badgeClasses = "bg-white text-zinc-900";
                let statusIcon = "";

                if (state.isAnswered) {
                  if (idx === q.correctIndex) {
                    btnClasses = "bg-green-300 text-zinc-900 ring-4 ring-green-600";
                    badgeClasses = "bg-green-600 text-white";
                    statusIcon = `<span class="ml-auto text-xl font-extrabold" aria-label="Correct answer">✔</span>`;
                  } else if (idx === state.selectedOptionIdx) {
                    btnClasses = "bg-red-300 text-zinc-900 ring-4 ring-red-600";
                    badgeClasses = "bg-red-600 text-white";
                    statusIcon = `<span class="ml-auto text-xl font-extrabold" aria-label="Incorrect selection">✖</span>`;
                  } else {
                    btnClasses = "bg-zinc-100 text-zinc-500 opacity-75";
                  }
                }

                return `
                  <button
                    type="button"
                    onclick="selectQuizOption(${idx})"
                    ${state.isAnswered ? "disabled" : ""}
                    aria-checked="${state.selectedOptionIdx === idx}"
                    class="comic-btn w-full p-4 text-left font-bold text-base sm:text-lg flex items-center gap-3.5 ${btnClasses} ${state.isAnswered ? "cursor-default" : ""}"
                  >
                    <span class="w-9 h-9 rounded-xl border-2 border-zinc-900 ${badgeClasses} flex items-center justify-center font-extrabold shrink-0">
                      ${letters[idx]}
                    </span>
                    <span class="leading-snug">${escapeHtml(opt)}</span>
                    ${statusIcon}
                  </button>
                `;
              }).join("")}
            </div>

            <!-- Immediate Corrective Feedback Panel -->
            ${state.isAnswered ? renderImmediateFeedback(q) : `
              <p class="mt-6 text-sm font-bold text-zinc-500 text-center">
                Select one answer above to check your clue!
              </p>
            `}
          </div>
        </section>
      `;
    }

    function renderImmediateFeedback(q) {
      const isCorrect = state.selectedOptionIdx === q.correctIndex;
      const isLastQuestion = state.currentQuestionIdx === QUIZZES_DATA[state.activeCase].length - 1;

      return `
        <div
          role="alert"
          aria-live="assertive"
          class="mt-6 p-5 rounded-2xl border-3 border-zinc-900 animate-pop ${
            isCorrect ? "bg-green-200" : "bg-rose-100"
          }"
        >
          <div class="flex items-start gap-3 mb-2">
            <span class="text-2xl shrink-0" aria-hidden="true">${isCorrect ? "🎉" : "🔍"}</span>
            <div>
              <h3 class="text-xl font-bold text-zinc-900">
                ${isCorrect ? "Great job, Detective!" : "Not quite. Keep investigating!"}
              </h3>
              <p class="text-zinc-900 font-bold text-sm sm:text-base mt-1 leading-relaxed">
                ${escapeHtml(q.explanation)}
              </p>
            </div>
          </div>

          <div class="mt-4 flex justify-end">
            <button
              type="button"
              id="next-question-btn"
              onclick="advanceQuizQuestion()"
              class="comic-btn px-6 py-3 bg-amber-300 hover:bg-amber-200 text-zinc-900 font-bold text-base flex items-center gap-2"
            >
              <span>${isLastQuestion ? "See Final Results" : "Next Question"}</span>
              <span aria-hidden="true">➔</span>
            </button>
          </div>
        </div>
      `;
    }

    function selectQuizOption(optionIdx) {
      if (state.isAnswered) return; // Prevent duplicate attempts

      const questions = QUIZZES_DATA[state.activeCase];
      const currentQ = questions[state.currentQuestionIdx];
      const isCorrect = optionIdx === currentQ.correctIndex;

      state.selectedOptionIdx = optionIdx;
      state.isAnswered = true;

      if (isCorrect) {
        state.score += 1;
        playCorrectSound();
      } else {
        playIncorrectSound();
      }

      state.userAnswers.push({
        questionIdx: state.currentQuestionIdx,
        selectedIdx: optionIdx,
        isCorrect
      });

      renderApp();

      // Move focus gently to Next Question button for keyboard accessibility
      setTimeout(() => {
        const nextBtn = document.getElementById("next-question-btn");
        if (nextBtn) nextBtn.focus();
      }, 40);
    }

    function advanceQuizQuestion() {
      const questions = QUIZZES_DATA[state.activeCase];
      if (state.currentQuestionIdx < questions.length - 1) {
        state.currentQuestionIdx += 1;
        state.selectedOptionIdx = null;
        state.isAnswered = false;
        renderApp();
      } else {
        state.quizMode = "results";
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function renderQuizResults() {
      const questions = QUIZZES_DATA[state.activeCase];
      const total = questions.length;
      const correctCount = state.score;
      const incorrectCount = total - correctCount;

      let performanceMessage = "";
      let badgeEmoji = "";
      let bannerBg = "bg-amber-200";

      if (correctCount === 5) {
        performanceMessage = "Outstanding work, Detective!";
        badgeEmoji = "🏆";
        bannerBg = "bg-green-300";
      } else if (correctCount === 4) {
        performanceMessage = "Excellent investigation!";
        badgeEmoji = "🌟";
        bannerBg = "bg-sky-300";
      } else if (correctCount === 3) {
        performanceMessage = "Good work! Keep practicing.";
        badgeEmoji = "👍";
        bannerBg = "bg-amber-200";
      } else {
        performanceMessage = "Every mistake is a new clue. Try again!";
        badgeEmoji = "🔎";
        bannerBg = "bg-purple-200";

      return `
        <section class="animate-pop max-w-3xl mx-auto">

            <h1 class="text-3xl sm:text-4xl font-bold text-zinc-900 mb-2">
              ${performanceMessage}
            </h1>

            <p class="comic-font text-4xl sm:text-5xl font-bold text-zinc-900 my-4">
              ${correctCount} / ${total}
            </p>

            <!-- Visual Star / Clue Meter -->
            <div class="flex items-center justify-center gap-2 mb-5" aria-label="Visual score indicator: ${correctCount} out of ${total} stars">
              ${Array.from({ length: total }, (_, i) => `
                <span class="w-10 h-10 rounded-xl border-3 border-zinc-900 flex items-center justify-center text-xl ${
                  i < correctCount ? "bg-amber-300 shadow-[2px_2px_0px_#18181b]" : "bg-white/70 opacity-50"
                }">
                  ${i < correctCount ? "⭐" : "☆"}
                </span>
              `).join("")}
            </div>

            <!-- Correct vs Incorrect Counters -->
            <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto mb-6">
              <div class="bg-white border-3 border-zinc-900 rounded-xl p-3">
                <span class="block text-2xl font-extrabold text-green-700">${correctCount}</span>
                <span class="text-xs font-extrabold uppercase text-zinc-700">Correct Answers</span>
              </div>
              <div class="bg-white border-3 border-zinc-900 rounded-xl p-3">
                <span class="block text-2xl font-extrabold text-red-600">${incorrectCount}</span>
                <span class="text-xs font-extrabold uppercase text-zinc-700">Incorrect Answers</span>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-3">
              <button
                type="button"
                onclick="restartCurrentQuiz()"
                class="comic-btn px-5 py-3 bg-amber-300 hover:bg-amber-200 text-zinc-900 font-bold text-base"

              <button

    function downloadOriginalWorksheetPdf() {
      const blob = generateWorksheetPdfBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "detective-worksheet-comic.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast("Downloading detective-worksheet-comic.pdf...");
    }

    /* ============================================================================
       9. HTML ESCAPING HELPERS
    ============================================================================ */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
    }

    /* ============================================================================
       10. INITIALIZE APPLICATION ON WINDOW LOAD
    ============================================================================ */
    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
    });
